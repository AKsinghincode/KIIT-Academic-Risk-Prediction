<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Academic Risk Dashboard - EduRisk AI</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body { background-color: #f8f9fa; }
        .navbar { background-color: #212529; }
        .card-stat { border-radius: 8px; color: #fff; padding: 20px; }
        .card-total { background-color: #0d6efd; }
        .card-high { background-color: #dc3545; }
        .card-medium { background-color: #ffc107; color: #000; }
        .card-low { background-color: #198754; }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark px-4">
        <a class="navbar-brand fw-bold" href="#">EduRisk AI</a>
        <div class="ms-auto">
            <a href="/dashboard" class="text-white me-3 text-decoration-none opacity-75">Dashboard</a>
            <a href="/predict" class="text-white text-decoration-none">+ New Prediction</a>
        </div>
    </nav>

    <div class="container my-4">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2 class="fw-bold">Academic Risk Dashboard</h2>
            <div>
                <a href="/dashboard/export-high-risk" class="btn btn-outline-danger me-2">Download High Risk List (CSV)</a>
                <a href="/predict" class="btn btn-primary">+ New Prediction</a>
            </div>
        </div>

        <!-- Metric Cards -->
        <div class="row g-3 mb-4">
            <div class="col-md-3">
                <div class="card-stat card-total">
                    <small>Total Evaluated</small>
                    <h1 class="fw-bold m-0">{{ total_students }}</h1>
                </div>
            </div>
            <div class="col-md-3">
                <div class="card-stat card-high">
                    <small>High Risk</small>
                    <h1 class="fw-bold m-0">{{ high_risk_count }}</h1>
                </div>
            </div>
            <div class="col-md-3">
                <div class="card-stat card-medium">
                    <small>Medium Risk</small>
                    <h1 class="fw-bold m-0">{{ medium_risk_count }}</h1>
                </div>
            </div>
            <div class="col-md-3">
                <div class="card-stat card-low">
                    <small>Low Risk</small>
                    <h1 class="fw-bold m-0">{{ low_risk_count }}</h1>
                </div>
            </div>
        </div>

        <!-- Visualizations -->
        <div class="row g-4">
            <div class="col-md-6">
                <div class="card shadow-sm border-0 p-3">
                    <h5 class="fw-bold mb-3">Risk Distribution</h5>
                    <div style="height: 300px;" class="d-flex justify-content-center">
                        <canvas id="riskDoughnutChart"></canvas>
                    </div>
                </div>
            </div>
            <div class="col-md-6">
                <div class="card shadow-sm border-0 p-3">
                    <h5 class="fw-bold mb-3">Performance vs Risk Summary</h5>
                    <div style="height: 300px;">
                        <canvas id="performanceBarChart"></canvas>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Risk Distribution Doughnut Chart
        const ctxDoughnut = document.getElementById('riskDoughnutChart').getContext('2d');
        new Chart(ctxDoughnut, {
            type: 'doughnut',
            data: {
                labels: ['High Risk', 'Medium Risk', 'Low Risk'],
                datasets: [{
                    data: [{{ high_risk_count }}, {{ medium_risk_count }}, {{ low_risk_count }}],
                    backgroundColor: ['#dc3545', '#ffc107', '#198754']
                }]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                plugins: { legend: { position: 'bottom' } }
            }
        });

        // Performance vs Risk Summary Bar Chart
        const ctxBar = document.getElementById('performanceBarChart').getContext('2d');
        new Chart(ctxBar, {
            type: 'bar',
            data: {
                labels: ['High Risk', 'Medium Risk', 'Low Risk', 'Class Average'],
                datasets: [{
                    label: 'Average Performance Score',
                    data: [42, 64, 82, 72],
                    backgroundColor: ['#dc3545', '#ffc107', '#198754', '#0d6efd']
                }]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                scales: { y: { beginAtZero: true, max: 100 } }
            }
        });
    </script>
</body>
</html>
