{% extends 'base.html' %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-8">
        <!-- Single Input Form Card -->
        <div class="card shadow-sm border-0">
            <div class="card-header bg-primary text-white fw-bold">Input Student Metrics</div>
            <div class="card-body">
                <form action="/predict" method="POST">
                    <div class="row g-3">
                        <div class="col-md-6">
                            <label class="form-label">Attendance %</label>
                            <input type="number" step="0.1" class="form-control" name="attendance" required>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Midterm Score</label>
                            <input type="number" step="0.1" class="form-control" name="midterm" required>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Assignment Score</label>
                            <input type="number" step="0.1" class="form-control" name="assignment" required>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Quiz Score</label>
                            <input type="number" step="0.1" class="form-control" name="quiz" required>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Study Hours</label>
                            <input type="number" step="0.5" class="form-control" name="study_hours" required>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Backlogs</label>
                            <input type="number" class="form-control" name="backlogs" required>
                        </div>
                    </div>
                    <button type="submit" class="btn btn-primary mt-3 w-100">Run Analysis</button>
                </form>
            </div>
        </div>

        <!-- Batch CSV Upload Card (Pasted inside the block) -->
        <div class="card shadow-sm border-0 mt-4">
            <div class="card-header bg-dark text-white fw-bold">Batch Prediction (CSV Upload)</div>
            <div class="card-body">
                <form action="/predict/batch" method="POST" enctype="multipart/form-data">
                    <div class="mb-3">
                        <label for="file" class="form-label">Upload CSV File (roll_number, name, attendance, midterm)</label>
                        <input type="file" class="form-control" id="file" name="file" accept=".csv" required>
                    </div>
                    <button type="submit" class="btn btn-secondary">Upload & Process Batch</button>
                </form>
            </div>
        </div>

    </div>
</div>
{% endblock %}
